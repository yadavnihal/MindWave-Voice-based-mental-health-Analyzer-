<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up - MindWave</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Syne:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/auth.css">
</head>
<body class="auth-page">

<div class="auth-bg"></div>

<div class="auth-container">
  <a href="/" class="auth-back">← Back to home</a>
  
  <div class="auth-card">
    <div class="auth-logo">
      <svg width="32" height="32" viewBox="0 0 28 28" fill="none">
        <circle cx="14" cy="14" r="12" stroke="url(#grad4)" stroke-width="2"/>
        <path d="M6 14 Q10 6 14 14 Q18 22 22 14" stroke="url(#grad4)" stroke-width="2" fill="none" stroke-linecap="round"/>
        <defs><linearGradient id="grad4" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#6C5CE7"/><stop offset="100%" style="stop-color:#00D4FF"/></linearGradient></defs>
      </svg>
    </div>
    
    <h1 class="auth-title">Create Account</h1>
    <p class="auth-subtitle">Start analyzing your emotions today</p>
    
    <form class="auth-form" id="signup-form">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="John Doe" required>
      </div>
      
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required>
      </div>
      
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      
      <div id="signup-error" style="color:#e24b4a;font-size:13px;display:none;margin-bottom:8px"></div>
      <button type="submit" class="btn-gradient btn-full">Create Account</button>
    </form>
    
    <div class="auth-footer">
      <p>Already have an account? <a href="/login">Login</a></p>
    </div>
  </div>
</div>

<script>
document.getElementById('signup-form').addEventListener('submit', function(e) {
  e.preventDefault();
  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const err = document.getElementById('signup-error');
  const users = JSON.parse(localStorage.getItem('MindWave_users') || '[]');
  if (users.find(u => u.email === email)) {
    err.textContent = 'An account with this email already exists.';
    err.style.display = 'block';
    return;
  }
  const user = { name, email, password };
  users.push(user);
  localStorage.setItem('MindWave_users', JSON.stringify(users));
  localStorage.setItem('MindWave_current', JSON.stringify(user));
  window.location.href = '/dashboard';
});
</script>
</body>
</html>
